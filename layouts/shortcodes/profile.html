<div class="profile-block">
  <div class="profile-image">
    <img src="{{ .Get "image" | relURL}}" alt="{{ .Get "alt" }}" style="width: 250px; height: 250px; object-fit: cover; border-radius: 50%; border-color: #fff; border-width: 5px;">
  </div>
  <div class="profile-text">
    {{ .Inner | markdownify }}
  </div>
</div>
